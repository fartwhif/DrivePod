name: drivepod

services:
  drivepod:
    build: .
    image: drivepod
    container_name: drivepod
    restart: unless-stopped
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    ports:
        - "${VPS_IP:-0.0.0.0}:${NGINX_PORT:-24320}:80"
    volumes:
      - /mnt/e/projects/drivepod/data:/mnt/e/projects/drivepod/data
      - /mnt/e/projects/drivepod/cache:/mnt/e/projects/drivepod/cache
      - /lib/modules:/lib/modules:ro
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    depends_on:
      - bgutil-provider

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider
    container_name: drivepod-bgutil
    init: true
    restart: unless-stopped
